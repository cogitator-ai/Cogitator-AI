packages:
  - 'packages/*'
  - 'examples'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  onnxruntime-node: true
  msgpackr-extract: true
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@whiskeysockets/baileys': false

blockExoticSubdeps: true

# Only install versions published at least a day ago. Setting it explicitly makes pnpm
# fail instead of silently adding exclusions when a range has no old-enough version.
minimumReleaseAge: 1440
