packages:
  - 'packages/*'
  - 'examples'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  onnxruntime-node: true
  msgpackr-extract: true
  cpu-features: false
  ssh2: false
  protobufjs: false
  '@whiskeysockets/baileys': false

blockExoticSubdeps: true

# Only install versions published at least a day ago. Setting it explicitly makes pnpm
# fail instead of silently adding exclusions when a range has no old-enough version.
minimumReleaseAge: 1440

overrides:
  # @qdrant/js-client-rest 1.19.0 pins undici 7.29.0, which has known
  # vulnerabilities fixed in 7.29.1. Drop this once the client allows a fixed undici.
  '@qdrant/js-client-rest>undici': ^7.29.1
