# Services the gauntlet stages talk to. Ports are offset so they do not clash with the
# Postgres, Redis, Qdrant and MongoDB you may already run for development.
#   docker compose -f packages/gauntlet/compose.yml up -d
name: cogitator-gauntlet

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: gauntlet
      POSTGRES_DB: gauntlet
    ports: ['55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gauntlet']
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    ports: ['56333:6333']

  # MongoDB 8 refuses to start on Linux 6.19 and newer (SERVER-121912), which recent Docker
  # VMs run, so the gauntlet stays on 7.0 until that is fixed.
  mongodb:
    image: mongo:7.0
    ports: ['57017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 2s
      retries: 30
