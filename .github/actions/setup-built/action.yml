name: Set up the built workspace
description: Installs the dependencies and unpacks the build the Build job made, so a test job does not build again.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - uses: actions/download-artifact@v8
      with:
        name: build

    - shell: bash
      run: tar -xzf build.tgz && rm build.tgz
