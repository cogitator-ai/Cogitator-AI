name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (via @huggingface/transformers) downloads its CUDA
  # binaries on Linux x64 at install time; CI never uses them and the
  # download host times out now and then.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

permissions:
  contents: read

jobs:
  ollama:
    name: Ollama Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull qwen2.5:0.5b

      - name: Run Ollama integration tests
        run: |
          pnpm --filter @cogitator-ai/core exec vitest run \
            src/__tests__/integration/ollama.integration.test.ts \
            test/integration.test.ts
        env:
          TEST_OLLAMA: 'true'
          TEST_MODEL: qwen2.5:0.5b
          NODE_OPTIONS: '--max-old-space-size=4096'

  google:
    name: Google Gemini Integration
    runs-on: ubuntu-latest
    # Set the repository variable GEMINI_TESTS to "off" to skip Gemini calls, for example
    # when the API key has hit its spending cap.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GEMINI_TESTS != 'off'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run Google integration tests
        run: |
          pnpm --filter @cogitator-ai/core exec vitest run \
            src/__tests__/integration/google.integration.test.ts
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cogitator
          POSTGRES_PASSWORD: cogitator
          POSTGRES_DB: cogitator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cogitator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz > /dev/null && break
            sleep 1
          done

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done

      - name: Pull model
        run: ollama pull qwen2.5:0.5b

      # The scaffolder matrix runs on a scripted model in the CI workflow, one
      # job per package manager. Here it took 8 of the 20 minutes this job has.
      - name: Run E2E tests
        run: pnpm --filter @cogitator-ai/e2e exec vitest run --exclude 'src/__tests__/create-cogitator-app/matrix.e2e.ts'
        env:
          TEST_OLLAMA: 'true'
          TEST_MODEL: qwen2.5:0.5b
          TEST_REDIS: 'true'
          TEST_POSTGRES_URL: postgresql://cogitator:cogitator@localhost:5432/cogitator
          TEST_MONGODB_URL: mongodb://localhost:27017
          TEST_QDRANT_URL: http://localhost:6333
          TEST_DOCKER: 'true'
          GOOGLE_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GEMINI_TESTS != 'off' && secrets.GOOGLE_API_KEY || '' }}
          OLLAMA_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OLLAMA_API_KEY || '' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
