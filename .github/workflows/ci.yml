name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (via @huggingface/transformers) downloads its CUDA
  # binaries on Linux x64 at install time; CI never uses them and the
  # download host times out now and then.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The test jobs run on this build instead of building again. tar keeps the
      # executable bits of the CLI entries, which an artifact alone would drop.
      - run: tar -czf build.tgz packages/*/dist packages/core/docs

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tgz
          retention-days: 1
          if-no-files-found: error

  # Unit tests of every package. The e2e suite and the scaffolder matrix run in
  # jobs of their own: next to them the runner was so busy that unit tests ran
  # into their timeouts.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-built

      - run: pnpm exec turbo run test --only --filter='!@cogitator-ai/tetsu' --filter='!@cogitator-ai/e2e'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-built

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # The Studio e2e skips itself without a browser, so a failed install never fails the job.
      # Runners ship Google Chrome, so its system libraries are usually there: apt only runs
      # when the headless shell cannot start, with short timeouts so an unreachable mirror
      # gives way to the next one instead of hanging the job.
      - name: Install Chromium for the Studio e2e
        continue-on-error: true
        timeout-minutes: 5
        working-directory: packages/e2e
        run: |
          pnpm exec playwright install --only-shell chromium
          if ! node -e "require('playwright').chromium.launch().then((b) => b.close())"; then
            printf 'Acquire::http::Timeout "15";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
            pnpm exec playwright install-deps chromium
          fi

      - run: pnpm --filter @cogitator-ai/e2e exec vitest run --exclude 'src/__tests__/create-cogitator-app/matrix.e2e.ts'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # Every preset installed from the workspace tarballs, checked, run and built
  # into a Docker image, one package manager per job. The model is scripted,
  # so it needs no Ollama.
  scaffold-matrix:
    name: Scaffold matrix (${{ matrix.pm }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, npm, bun]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-built

      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - run: pnpm --filter @cogitator-ai/e2e exec vitest run src/__tests__/create-cogitator-app/matrix.e2e.ts
        env:
          MATRIX_PMS: ${{ matrix.pm }}
          NODE_OPTIONS: '--max-old-space-size=4096'

  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter='@cogitator-ai/tetsu...'

      - run: pnpm --filter @cogitator-ai/tetsu test
