name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # onnxruntime-node (via @huggingface/transformers) downloads its CUDA
  # binaries on Linux x64 at install time; CI never uses them and the
  # download host times out now and then.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cogitator-ai'

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            count=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
            if [ "$count" -gt "0" ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        # Committed here and pushed only after the build and its checks pass:
        # a version commit on main consumes the changesets, and a failed run
        # cannot be rerun past it.
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          pnpm install --lockfile-only
          git add -A
          git commit -m "chore: version packages" || echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        # After the version bump: create-cogitator-app bakes its own version,
        # the package versions it pins and the telemetry website id into its
        # build, so building earlier published the previous release's numbers.
        run: pnpm build
        env:
          COGITATOR_UMAMI_WEBSITE_ID: ${{ secrets.COGITATOR_UMAMI_WEBSITE_ID }}

      - name: Check the scaffolder build
        run: pnpm exec tsx scripts/check-scaffolder-build.ts

      - name: Check the packages
        # The tarballs about to be published, with the bumped versions, go
        # through publint and arethetypeswrong before anything is pushed.
        run: pnpm check:packages

      - name: Push the version commit
        if: steps.changesets.outputs.has_changesets == 'true'
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        # pnpm publish -r skips versions that already exist in the registry,
        # so any non-zero exit is a real failure. Only scoped packages can go
        # to GitHub Packages; create-cogitator-app is npm-only.
        run: pnpm publish -r --filter "@cogitator-ai/*" --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: npm
        # Needs the NPM_TOKEN repository secret (granular token with publish
        # rights that bypasses 2FA); skipped when it is not configured.
        # provenance=true signs each package with this workflow's OIDC token
        # (id-token: write above) and records it in the public transparency
        # log, so npm shows where and from which commit it was built.
        # pnpm stops at the first package npm refuses, and npm can refuse a
        # version it is still staging from an attempt whose answer was lost
        # (409), so the publish is tried up to three times: each attempt skips
        # the versions npm already has. pnpm writes its summary only after a
        # fully successful run, so the versions of each attempt are read from
        # its summary and from its "Published package" lines, and merged for
        # the release step.
        run: |
          set -o pipefail
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set, skipping npm publish"
            exit 0
          fi
          npmrc="$RUNNER_TEMP/npmjs.npmrc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            '@cogitator-ai:registry=https://registry.npmjs.org/' \
            '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' \
            'provenance=true' > "$npmrc"
          published="$RUNNER_TEMP/published.json"
          output="$RUNNER_TEMP/publish.log"
          echo '{"publishedPackages":[]}' > "$published"
          collect() {
            node -e '
              const fs = require("fs");
              const [file, log, summary] = process.argv.slice(1);
              const all = JSON.parse(fs.readFileSync(file, "utf8"));
              const found = fs.existsSync(summary)
                ? (JSON.parse(fs.readFileSync(summary, "utf8")).publishedPackages ?? [])
                : [];
              for (const line of fs.readFileSync(log, "utf8").split("\n")) {
                const match = /Published package (\S+)@(\S+)\s*$/.exec(line);
                if (match) found.push({ name: match[1], version: match[2] });
              }
              const seen = new Set(all.publishedPackages.map((p) => `${p.name}@${p.version}`));
              for (const pkg of found) {
                const id = `${pkg.name}@${pkg.version}`;
                if (!seen.has(id)) all.publishedPackages.push({ name: pkg.name, version: pkg.version });
                seen.add(id);
              }
              fs.writeFileSync(file, JSON.stringify(all));
            ' "$published" "$output" pnpm-publish-summary.json
            rm -f pnpm-publish-summary.json
          }
          status=1
          for attempt in 1 2 3; do
            if NPM_CONFIG_USERCONFIG="$npmrc" pnpm publish -r --access public --no-git-checks --report-summary 2>&1 | tee "$output"; then
              status=0
            fi
            collect
            [ "$status" -eq 0 ] && break
            echo "npm publish attempt $attempt failed, trying the remaining packages again"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          cp "$published" pnpm-publish-summary.json
          exit "$status"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub releases
        # Tags and releases every version just published (from the publish
        # summary) or already served by npm that has no release yet, with that
        # version's CHANGELOG section as the notes. It runs after a failed npm
        # publish too, for the packages that did reach npm, but not when the
        # publish never ran, since the version commit may not be on main then.
        if: ${{ !cancelled() && (steps.npm.outcome == 'success' || steps.npm.outcome == 'failure') }}
        run: npx tsx scripts/github-releases.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
