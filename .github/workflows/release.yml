name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # onnxruntime-node (via @huggingface/transformers) downloads its CUDA
  # binaries on Linux x64 at install time; CI never uses them and the
  # download host times out now and then.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cogitator-ai'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            count=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
            if [ "$count" -gt "0" ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset version
          pnpm install --lockfile-only
          git add -A
          git commit -m "chore: version packages" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        # pnpm publish -r skips versions that already exist in the registry,
        # so any non-zero exit is a real failure. Only scoped packages can go
        # to GitHub Packages; create-cogitator-app is npm-only.
        run: pnpm publish -r --filter "@cogitator-ai/*" --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        # Needs the NPM_TOKEN repository secret (granular token with publish
        # rights that bypasses 2FA); skipped when it is not configured.
        # provenance=true signs each package with this workflow's OIDC token
        # (id-token: write above) and records it in the public transparency
        # log, so npm shows where and from which commit it was built.
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set, skipping npm publish"
            exit 0
          fi
          npmrc="$RUNNER_TEMP/npmjs.npmrc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            '@cogitator-ai:registry=https://registry.npmjs.org/' \
            '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' \
            'provenance=true' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm publish -r --access public --no-git-checks --report-summary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub releases
        # Tags and releases every version just published (from the publish
        # summary) or already served by npm that has no release yet, with that
        # version's CHANGELOG section as the notes.
        run: npx tsx scripts/github-releases.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
