name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node (via @huggingface/transformers) downloads its CUDA
  # binaries on Linux x64 at install time; CI never uses them and the
  # download host times out now and then.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - run: pnpm format:check
